name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run check:workflows

      - run: bun run test:coverage

      - run: bun audit --audit-level=high

  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
      has-e2e-secrets: ${{ steps.check.outputs.has-e2e-secrets }}
    steps:
      - id: check
        env:
          URL: ${{ secrets.SUPABASE_TEST_URL }}
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          if [ -n "$URL" ]; then
            echo "has-secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has-secrets=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$STAGING_APP_URL" ]; then
            echo "has-e2e-secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has-e2e-secrets=false" >> $GITHUB_OUTPUT
          fi

  rls-integration:
    needs: check-secrets
    runs-on: ubuntu-latest
    # Only run when the required secrets are configured.
    # SUPABASE_TEST_URL  — HTTPS project URL used by the Supabase JS SDK in tests.
    # SUPABASE_TEST_DB_URL — postgres connection string used by psql to apply
    #   migrations, e.g. postgresql://postgres:[password]@db.xxxx.supabase.co:5432/postgres
    if: needs.check-secrets.outputs.has-secrets == 'true'
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x

      - run: bun install --frozen-lockfile

      - name: Apply RLS migration
        # Applies every up-migration (excludes *.down.sql) in lexicographic
        # filename order, discovered dynamically rather than hardcoded — a
        # fixed -f list silently stops covering new migrations the moment
        # someone adds one and forgets to append it here, which reads as a
        # green check without actually applying/testing the new SQL.
        run: |
          for f in $(find supabase/migrations -maxdepth 1 -name '*.sql' ! -name '*.down.sql' | sort); do
            echo "Applying $f"
            psql "$SUPABASE_TEST_DB_URL" --set=ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run RLS integration tests
        run: bun run test:rls

  e2e:
    needs: check-secrets
    runs-on: ubuntu-latest
    # Only runs when staging (#13) is provisioned and its secrets are
    # configured — otherwise skipped, not failed (issue #52, OQ4). Exercises
    # the invitation accept/deny/reminder and conflict-detection E2E flows,
    # plus the setlist publish and Google Calendar sync flows (issue #66),
    # against the real staging deployment: a real Clerk test-mode instance
    # (via @clerk/testing, OQ1) plus the staging Supabase project
    # (service-role client for seed/teardown only — see tests/e2e/support/).
    # calendar-sync.spec.ts additionally gates itself on the five Google
    # Calendar secrets below (documentation/staging-environment.md §7.1) and
    # skips (not fails) when they're absent, same pattern as the rest of the
    # suite gating on e2eAuthEnabled. Does NOT add a Vercel deploy step
    # (documentation/staging-environment.md §3): Vercel's Git integration
    # owns staging deploys entirely.
    if: needs.check-secrets.outputs.has-e2e-secrets == 'true'
    env:
      STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      E2E_TOKEN_ENCRYPTION_KEY: ${{ secrets.E2E_TOKEN_ENCRYPTION_KEY }}
      E2E_GOOGLE_CLIENT_ID: ${{ secrets.E2E_GOOGLE_CLIENT_ID }}
      E2E_GOOGLE_CLIENT_SECRET: ${{ secrets.E2E_GOOGLE_CLIENT_SECRET }}
      E2E_GOOGLE_REFRESH_TOKEN: ${{ secrets.E2E_GOOGLE_REFRESH_TOKEN }}
      E2E_GOOGLE_CALENDAR_ID: ${{ secrets.E2E_GOOGLE_CALENDAR_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x

      - run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run E2E tests against staging
        run: bun run test:e2e
