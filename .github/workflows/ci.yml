name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test:coverage

      - run: bun audit --audit-level=high

  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - id: check
        env:
          URL: ${{ secrets.SUPABASE_TEST_URL }}
        run: |
          if [ -n "$URL" ]; then
            echo "has-secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has-secrets=false" >> $GITHUB_OUTPUT
          fi

  rls-integration:
    needs: check-secrets
    runs-on: ubuntu-latest
    # Only run when the required secrets are configured.
    # SUPABASE_TEST_URL  — HTTPS project URL used by the Supabase JS SDK in tests.
    # SUPABASE_TEST_DB_URL — postgres connection string used by psql to apply
    #   migrations, e.g. postgresql://postgres:[password]@db.xxxx.supabase.co:5432/postgres
    if: needs.check-secrets.outputs.has-secrets == 'true'
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x

      - run: bun install --frozen-lockfile

      - name: Apply RLS migration
        run: |
          psql "$SUPABASE_TEST_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            -f supabase/migrations/20260702000001_cluster_1_organization.sql \
            -f supabase/migrations/20260702000002_cluster_2_instruments.sql \
            -f supabase/migrations/20260702000003_cluster_3_scheduling_core.sql \
            -f supabase/migrations/20260702000004_cluster_4_partial_songs.sql \
            -f supabase/migrations/20260702000005_cluster_5_partial.sql \
            -f supabase/migrations/20260702000006_cluster6_auth_audit.sql \
            -f supabase/migrations/20260703000001_users_self_read_rls.sql \
            -f supabase/migrations/20260704000001_rls_policies.sql \
            -f supabase/migrations/20260704000002_church_groups_rls.sql

      - name: Run RLS integration tests
        run: bun run test:rls
